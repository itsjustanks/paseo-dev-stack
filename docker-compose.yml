# devstack — Paseo daemons + Cloudflare tunnel + agent CLIs.
#
# Model routing is NOT part of this stack. Install an AI Router plugin (e.g.
# OmniRoute) into the daemon and point it at a router server; its settings
# are passed through from .env below.
#
# Security model: NOTHING is published to 0.0.0.0. Every port binds to
# 127.0.0.1 on the host, and the only public entrance is the Cloudflare tunnel
# (which dials OUT — no inbound firewall hole). Docker's iptables rules bypass
# UFW, so publishing to 0.0.0.0 here would expose the app regardless of `ufw
# deny` — hence the explicit 127.0.0.1 binds.

name: paseo-dev-stack

services:
  paseo: &paseo-common
    build:
      context: .
      dockerfile: docker/paseo/Dockerfile
      args:
        SUPABASE_VERSION: ${SUPABASE_VERSION:-}
        EXTRA_NPM_PACKAGES: ${EXTRA_NPM_PACKAGES:-}
        PDS_VERSION: ${PDS_VERSION:-dev}
    image: paseo-dev-stack/agents:latest
    container_name: paseo-dev-stack-paseo
    # The daemon reports its HOSTNAME when pairing. Docker defaults that to the
    # container ID (e.g. "ecb3f8bc1a3d"), which is what you would otherwise see
    # in the Paseo app — unreadable, and it changes on every recreate. Name it.
    hostname: ${PASEO_NAME:-paseo-main}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PASEO_PORT:-6767}:6767"
      # agent-browser live viewport stream (WebSocket). Lets you watch what the
      # headless browser sees from another machine — and click/type into it.
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT:-9223}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    environment:
      PASEO_PASSWORD: ${PASEO_PASSWORD:?PASEO_PASSWORD is required - copy .env.example to .env}
      PASEO_HOSTNAMES: ${PASEO_HOSTNAMES:-}
      # AI Router plugin (e.g. OmniRoute). Passed through unchanged; the plugin
      # defines what each means. Blank = unset, nothing else changes.
      # Satellites inherit these through the `paseo-common` anchor.
      AI_ROUTER_URL: ${AI_ROUTER_URL:-}
      AI_ROUTER_KEY: ${AI_ROUTER_KEY:-}
      AI_ROUTER_TOKEN: ${AI_ROUTER_TOKEN:-}
      AI_ROUTER_CONSOLE_URL: ${AI_ROUTER_CONSOLE_URL:-}
      # Agent CLI credentials (optional; blank = interactive login instead)
      GH_TOKEN: ${GH_TOKEN:-}
      SUPABASE_ACCESS_TOKEN: ${SUPABASE_ACCESS_TOKEN:-}
      CURSOR_API_KEY: ${CURSOR_API_KEY:-}
      # agent-browser streaming. The port MUST be pinned: the default is an
      # OS-assigned ephemeral port, which cannot be published from a container.
      AGENT_BROWSER_STREAM_PORT: ${AGENT_BROWSER_STREAM_PORT:-9223}
      AGENT_BROWSER_STREAM_BRIDGE_PORT: ${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}
      AGENT_BROWSER_STREAM_QUALITY: ${AGENT_BROWSER_STREAM_QUALITY:-80}
      AGENT_BROWSER_STREAM_MAX_WIDTH: ${AGENT_BROWSER_STREAM_MAX_WIDTH:-}
      AGENT_BROWSER_STREAM_MAX_HEIGHT: ${AGENT_BROWSER_STREAM_MAX_HEIGHT:-}
      # V8 heap for Node processes. Bounds the JS heap ONLY — Turbopack
      # allocates natively and ignores this, which is why mem_limit exists too.
      NODE_OPTIONS: ${NODE_OPTIONS:-}
    volumes:
      # Daemon state, agent configs, ALL credentials, auto-memory.
      - paseo-home:/home/paseo
      # Runtime global installs (`npm i -g`, `pnpm add -g`) land here and so
      # SURVIVE rebuilds. It is a separate PREFIX, not a mount over
      # /usr/local/lib/node_modules — mounting over that would mask the image's
      # own packages (the paseo CLI, agent-browser) exactly the way the
      # /home/paseo volume masks $HOME. A plain host directory, so you can see
      # and back up what is installed.
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      # Your code. Bind mount so it's editable from the host too.
      - ${WORKSPACE_DIR:-./workspace}:/workspace
      # Seed config + memory, copied in on FIRST BOOT ONLY (never overwrites).
      # These are two SIBLING mounts, not nested: mounting ./memory inside a
      # read-only ./config mount fails, because Docker cannot create the
      # mountpoint inside a read-only layer.
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    # Chromium in a container dies on the default 64MB /dev/shm.
    shm_size: 1gb
    # Memory ceiling for the whole agent container. Turbopack allocates OUTSIDE
    # the V8 heap, so NODE_OPTIONS=--max-old-space-size cannot bound a dev
    # server — a cgroup limit is the only hard cap. Without it one runaway
    # next-server takes the host down. Default 0 = unlimited (set in .env).
    mem_limit: ${PASEO_MEM_LIMIT:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT:-0}
    security_opt:
      - seccomp:unconfined   # lets headless Chromium sandbox properly
    networks: [pds]

  # ── Satellite Paseo daemons ────────────────────────────────────────────────
  # Extra, independent daemons. Each has its own state volume, its own
  # workspace, and its own pairing identity, so it runs its own agents. They
  # inherit the main daemon's environment, including the AI Router plugin
  # settings, so every daemon can route through the same router server.
  #
  #   docker compose --profile satellites up -d
  #
  # These merge the `paseo-common` anchor (`<<:`) rather than using `extends`.
  # `extends` APPENDS to the parent's list fields instead of replacing them, so
  # every satellite inherited the main daemon's 127.0.0.1:6767:6767 ALONGSIDE
  # its own mapping — `compose config` showed paseo-5 publishing 6767, 9223,
  # 6771 and 9228. The first satellite to start won 6767 and every other one
  # died with "Bind for 127.0.0.1:6767 failed: port is already allocated", so
  # satellites could never start together. The agent-browser stream port
  # collided the same way. A YAML merge key REPLACES a key the child redefines,
  # which is what `ports:` needs.
  #
  # `ports: !override` fixes it too, but only on Compose v2.24.4+ — older
  # Compose parses the tag without error and merges anyway, so a box on the
  # Engine 24 minimum this README documents would keep the bug with no warning.
  # The merge key is handled by the YAML parser, so it behaves the same on every
  # Compose 2.x.
  #
  # The flip side: a merge key replaces WHOLE keys, so anything a satellite
  # redefines it must redefine completely — which is why the global-packages
  # mount is repeated in each `volumes:` below rather than inherited.
  paseo-2:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-2
    hostname: ${PASEO_NAME_2:-paseo-2}
    ports:
      - "127.0.0.1:${PASEO_PORT_2:-6768}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_2:-9225}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-2:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_2:-./workspace-2}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_2:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_2:-0}

  paseo-3:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-3
    hostname: ${PASEO_NAME_3:-paseo-3}
    ports:
      - "127.0.0.1:${PASEO_PORT_3:-6769}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_3:-9226}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-3:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_3:-./workspace-3}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_3:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_3:-0}

  paseo-4:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-4
    hostname: ${PASEO_NAME_4:-paseo-4}
    ports:
      - "127.0.0.1:${PASEO_PORT_4:-6770}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_4:-9227}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-4:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_4:-./workspace-4}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_4:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_4:-0}

  paseo-5:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-5
    hostname: ${PASEO_NAME_5:-paseo-5}
    ports:
      - "127.0.0.1:${PASEO_PORT_5:-6771}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_5:-9228}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-5:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_5:-./workspace-5}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_5:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_5:-0}

  paseo-6:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-6
    hostname: ${PASEO_NAME_6:-paseo-6}
    ports:
      - "127.0.0.1:${PASEO_PORT_6:-6772}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_6:-9229}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-6:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_6:-./workspace-6}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_6:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_6:-0}

  paseo-7:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-7
    hostname: ${PASEO_NAME_7:-paseo-7}
    ports:
      - "127.0.0.1:${PASEO_PORT_7:-6773}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_7:-9230}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-7:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_7:-./workspace-7}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_7:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_7:-0}

  paseo-8:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-8
    hostname: ${PASEO_NAME_8:-paseo-8}
    ports:
      - "127.0.0.1:${PASEO_PORT_8:-6774}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_8:-9231}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-8:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_8:-./workspace-8}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_8:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_8:-0}

  paseo-9:
    <<: *paseo-common
    profiles: [satellites]
    container_name: pds-paseo-9
    hostname: ${PASEO_NAME_9:-paseo-9}
    ports:
      - "127.0.0.1:${PASEO_PORT_9:-6775}:6767"
      - "127.0.0.1:${AGENT_BROWSER_STREAM_PORT_9:-9232}:${AGENT_BROWSER_STREAM_BRIDGE_PORT:-9224}"
    volumes:
      - paseo-home-9:/home/paseo
      - ${GLOBAL_PACKAGES_DIR:-./global-packages}:/opt/npm-global
      - ${WORKSPACE_DIR_9:-./workspace-9}:/workspace
      - ./config:/opt/devstack-seed:ro
      - ./memory:/opt/devstack-seed-memory:ro
    mem_limit: ${PASEO_MEM_LIMIT_9:-0}
    memswap_limit: ${PASEO_MEMSWAP_LIMIT_9:-0}

  # Cloudflare tunnel — remotely-managed (token) mode.
  # Enabled only when TUNNEL_TOKEN is set:  docker compose --profile tunnel up -d
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: paseo-dev-stack-tunnel
    restart: unless-stopped
    profiles: [tunnel]
    # NOTE: uses :- not :? — compose interpolates every service's variables even
    # for inactive profiles, so :? would break `up` whenever TUNNEL_TOKEN is
    # unset. An empty token fails fast in this container only.
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}
    depends_on: [paseo]
    networks: [pds]

  # Quick tunnel — no Cloudflare account. Random *.trycloudflare.com URL,
  # NO authentication in front of it. Dev only; read the URL from the logs:
  #   docker compose logs cloudflared-quick | grep trycloudflare
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: paseo-dev-stack-tunnel-quick
    restart: unless-stopped
    profiles: [quick-tunnel]
    command: tunnel --no-autoupdate --url http://paseo:6767
    depends_on: [paseo]
    networks: [pds]

volumes:
  paseo-home:
  paseo-home-2:
  paseo-home-3:
  paseo-home-4:
  paseo-home-5:
  paseo-home-6:
  paseo-home-7:
  paseo-home-8:
  paseo-home-9:

networks:
  pds:
    driver: bridge
