name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write      # create the GitHub Release

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

# NOTE: the IMAGE is built and pushed by release-image.yml, which uses NATIVE
# amd64 + arm64 runners. Do not add a build job here — two workflows racing to
# push the same tag is how you get a half-published manifest.

jobs:
  release:
    name: github release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # generate-notes needs history

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "

          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
          \`\`\`

          ## Upgrade an existing deployment

          \`\`\`bash
          cd ~/paseo-dev-stack && make update
          \`\`\`

          Prebuilt image (amd64): \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${TAG#v}\`
          " || echo "release already exists — skipping"
