name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write      # create the GitHub Release
  packages: write      # push to GHCR

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    name: build + push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      # amd64 ONLY, deliberately.
      #
      # This image installs four agent CLIs from curl installers plus a ~150MB
      # Chrome download. Under QEMU emulation an arm64 build of that is roughly
      # 10-20x slower and routinely exceeds the 6h job limit — and several of
      # the vendor installers ship glibc amd64 binaries anyway, so the emulated
      # result would be broken even if it finished.
      #
      # arm64 users build locally instead (`make up`), which is native and fast.
      # If a native arm64 runner becomes available, add it as a second job with
      # its own platform and merge with a manifest list.
      - name: build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/paseo/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            PDS_VERSION=${{ github.ref_name }}

  release:
    name: github release
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # generate-notes needs history

      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --notes "

          ## Install

          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sudo bash
          \`\`\`

          ## Upgrade an existing deployment

          \`\`\`bash
          cd ~/paseo-dev-stack && make update
          \`\`\`

          Prebuilt image (amd64): \`${{ env.REGISTRY }}/${{ env.IMAGE }}:${TAG#v}\`
          " || echo "release already exists — skipping"
