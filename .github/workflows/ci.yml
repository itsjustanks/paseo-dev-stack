name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: shell + python + compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          # SC1091: we source files that only exist at runtime in the container.
          # SC2016: single-quoted $VARS inside docker exec are intentional —
          #         they must expand INSIDE the container, not on the host.
          shellcheck -e SC1091,SC2016 -S warning \
            install.sh scripts/*.sh docker/paseo/*.sh

      - name: python syntax + lint
        run: |
          python3 -m compileall -q scripts/*.py scripts/guard/*.py docker/paseo/*.py
          pipx install ruff >/dev/null 2>&1 || pip install --user ruff
          ruff check --select=E9,F63,F7,F82 scripts/ docker/ || true

      - name: compose config is valid
        run: |
          cp .env.example .env
          sed -i 's/^PASEO_PASSWORD=.*/PASEO_PASSWORD=ci-test/' .env
          docker compose config --quiet
          echo "compose OK"

      - name: hadolint
        uses: hadolint/hadolint-action@v3.3.0
        with:
          dockerfile: docker/paseo/Dockerfile
          # DL3008/DL3018: we deliberately do not pin apt versions — the base
          # image moves and pinning would break the build on every upstream bump.
          # DL3059: consecutive RUNs are separate on purpose so one upstream
          # outage does not invalidate every agent-CLI layer.
          ignore: DL3008,DL3018,DL3059
          failure-threshold: error

  build:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Build only — no push. This is the real smoke test: it catches a bad
      # package name, a dead installer URL, or a 404 on a pinned version.
      - name: build agent image (amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/paseo/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: paseo-dev-stack/agents:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: agent CLIs are present and not masked by the volume
        run: |
          # The #1 regression: an agent CLI installed into $HOME vanishes when
          # /home/paseo mounts. Run WITH the volume mounted to prove it doesn't.
          docker run --rm -v pds-ci-home:/home/paseo \
            --entrypoint bash paseo-dev-stack/agents:ci -lc '
              set -e
              for c in claude codex kimi cursor-agent agent-browser supabase gh code uv; do
                command -v "$c" >/dev/null || { echo "MISSING: $c"; exit 1; }
                echo "ok: $c"
              done'
